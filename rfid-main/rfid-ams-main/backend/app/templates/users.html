{% extends "base.html" %}
{% block content %}
<h1>Users</h1>
<table>
  <thead>
    <tr><th>ID</th><th>Username</th><th>Email</th><th>Roles</th><th>Active</th></tr>
  </thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.email }}</td>
      <td>{% for r in u.roles %}{{ r.name }} {% endfor %}</td>
      <td>{{ 'yes' if u.is_active else 'no' }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
