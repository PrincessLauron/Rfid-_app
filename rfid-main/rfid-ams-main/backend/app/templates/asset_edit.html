{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Edit — {{ asset.name }}</h1>
    <p>Update asset details, status, and location.</p>
  </div>
</div>

<form method="post" action="/inventory/assets/{{ asset.id }}/edit" class="card" style="max-width:720px;">
  <input type="hidden" name="back_url" value="{{ back_url }}">

  <div class="form-grid">
    <div class="form-field">
      <label for="name">Name</label>
      <input id="name" name="name" value="{{ asset.name }}" required>
    </div>
    <div class="form-field">
      <label for="serial_number">Serial Number</label>
      <input id="serial_number" name="serial_number" value="{{ asset.serial_number or '' }}">
    </div>
    <div class="form-field">
      <label for="component_type">Component Type</label>
      <select id="component_type" name="component_type">
        <option value="">— Select —</option>
        <option value="pc" {% if asset.component_type == 'pc' %}selected{% endif %}>PC</option>
        <option value="monitor" {% if asset.component_type == 'monitor' %}selected{% endif %}>Monitor</option>
        <option value="keyboard" {% if asset.component_type == 'keyboard' %}selected{% endif %}>Keyboard</option>
        <option value="mouse" {% if asset.component_type == 'mouse' %}selected{% endif %}>Mouse</option>
        <option value="adapter" {% if asset.component_type == 'adapter' %}selected{% endif %}>Adapter</option>
        <option value="cables" {% if asset.component_type == 'cables' %}selected{% endif %}>Ethernet Cable</option>
      </select>
    </div>
    <div class="form-field">
      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="">— Select —</option>
        {% for code, label in status_options %}
        <option value="{{ code }}" {% if asset.status == code %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="location">Location</label>
      <input id="location" name="location" value="{{ asset.location or '' }}">
    </div>
    <div class="form-field">
      <label for="room_id">Laboratory</label>
      <select id="room_id" name="room_id">
        <option value="">— None —</option>
        {% for r in rooms %}
        <option value="{{ r.id }}" {% if asset.room_id == r.id %}selected{% endif %}>{{ r.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="form-field" style="margin-top:14px;">
    <label for="specs">Specs / Details</label>
    <textarea id="specs" name="specs" rows="5" style="width:100%;">{{ asset.specs or '' }}</textarea>
    <p class="helper">Example: Processor: M1 | RAM: 8GB | Storage: 256GB | Display: 24-inch Retina</p>
  </div>

  <div class="form-actions">
    <button type="submit">Save Changes</button>
    <a href="{{ back_url }}"><button type="button" class="secondary">Cancel</button></a>
  </div>
</form>
{% endblock %}
